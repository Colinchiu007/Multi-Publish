name: 债务熔断门禁

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '01-docs/**'
      - 'docs/**'
      - '*.md'
      - '.github/ISSUE_TEMPLATE/**'

jobs:
  debt-guard:
    name: 债务熔断检查
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: 检查债务预算
        run: node scripts/check-debt-budget.js
