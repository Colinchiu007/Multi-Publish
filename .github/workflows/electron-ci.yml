# Electron CI — Linux 平台确定性回归（GitHub 官方 ubuntu-latest runner）
# 职责边界（2026-08-09 迁移 A/B/C）：
# 1. 本 job 从阿里云 ECS 自托管 runner 迁移至 GitHub 官方 ubuntu-latest：消除单机排队（原先常
#    queued 30-40 分钟）与生产隔离问题（ECS 同时承载 Logto + 业务 API，20 分钟全量测试抢资源）。
# 2. 本 job = Linux 平台桌面 vitest（单 worker、确定性）+ Electron xvfb 冒烟 + deps/circular 检查，
#    与 Quality Gate（windows-latest 全 workspace 单测）形成跨平台互补，而非重复跑全量；
#    Electron GUI 深度门禁由 gui-test.yml（同 ubuntu-latest + xvfb）承担。
# 3. xvfb 提供虚拟显示器；better-sqlite3 不在依赖图（sqlite-wrapper.js 为 sql.js 兼容层），无需 @electron/rebuild。
# 4. ECS 自托管 runner 保留配置但不再必需；如需移除，见仓库 Settings → Actions → Runners。
name: Electron CI

on:
  push:
    branches: [main]
    paths-ignore:
      # 文档/流程改动不触发 CI（清单与 .github/scripts/workflow-contract.test.js 的 CI_IGNORED_PATHS 保持同步）
      - '01-docs/**'
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
      - '.ccg/**'
      - '.claude/**'
      - '.hermes/**'
      - '.agents/**'
      - 'openspec/**'
  pull_request:
    branches: [main]
jobs:
  electron-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: test
      SKIP_NATIVE_MEDIA_TOOL_TESTS: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install system deps (Xvfb + build tools + python for node-gyp)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb build-essential python3

      - name: Install dependencies
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Restore required JavaScript runtimes
        run: |
          node scripts/run-package-install.js esbuild
          node scripts/run-package-install.js --script scripts/postinstall.js vue-demi

      - name: Verify Electron checksum pin
        run: |
          node -e "const checksums = require('./node_modules/electron/checksums.json'); const artifact = 'electron-v43.1.1-linux-x64.zip'; const expected = 'c1f479c52747caf1510e17500e1c8a556d0e40802837bd48c5647a84688a3880'; if (checksums[artifact] !== expected) throw new Error('Electron checksum pin mismatch: ' + artifact);"

      - name: Install Electron runtime
        timeout-minutes: 10
        env:
          ELECTRON_MIRROR: https://cdn.npmmirror.com/binaries/electron/
        run: |
          unset electron_use_remote_checksums npm_config_electron_use_remote_checksums
          node node_modules/electron/install.js

      - name: Unit tests (Vitest, non-Electron, single-worker deterministic)
        run: |
          timeout --signal=TERM --kill-after=30s 20m \
            pnpm --filter @multi-publish/desktop test -- \
            --maxWorkers=1 --no-file-parallelism --reporter=verbose \
            --testTimeout=10000 --hookTimeout=10000 --teardownTimeout=10000

      - name: Vitest failure diagnostics
        if: failure()
        run: |
          echo "Vitest 或前置步骤失败，输出 runner 进程树"
          ps -eo pid,ppid,stat,etimes,pcpu,pmem,cmd --forest

      - name: Electron smoke test (xvfb)
        run: |
          cd apps/desktop
          set +e
          timeout 30 xvfb-run --auto-servernum pnpm exec electron . --no-sandbox --disable-gpu 2>&1
          status=$?
          set -e
          if [ "$status" -eq 124 ]; then
            echo "Electron remained alive for the smoke window"
          elif [ "$status" -eq 0 ]; then
            echo "Electron exited before the smoke window completed"
            exit 1
          else
            exit "$status"
          fi

      - name: Build Vue frontend
        run: |
          pnpm --filter @multi-publish/desktop build:vue

      - name: Dependency check
        run: pnpm run check:deps

      - name: Circular dependency check
        run: pnpm run check:circular
