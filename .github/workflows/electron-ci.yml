# Electron CI — 在阿里云 ECS 自托管 runner 上运行 headless Electron 测试
# 需要 xvfb 提供虚拟显示器，self-hosted runner 预先配置
name: Electron CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  electron-tests:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    env:
      NODE_ENV: test
      SKIP_NATIVE_MEDIA_TOOL_TESTS: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install system deps
        run: |
          if ! command -v xvfb-run &>/dev/null; then
            sudo dnf install -y -q xorg-x11-server-Xvfb
          fi

      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund

      - name: Restore required JavaScript runtimes
        run: |
          node node_modules/esbuild/install.js
          node node_modules/@remotion/bundler/node_modules/esbuild/install.js
          node node_modules/vue-demi/scripts/postinstall.js

      - name: Verify Electron checksum pin
        run: |
          node -e "const checksums = require('./node_modules/electron/checksums.json'); const artifact = 'electron-v43.1.1-linux-x64.zip'; const expected = 'c1f479c52747caf1510e17500e1c8a556d0e40802837bd48c5647a84688a3880'; if (checksums[artifact] !== expected) throw new Error('Electron checksum pin mismatch: ' + artifact);"

      - name: Install Electron runtime
        timeout-minutes: 5
        env:
          ELECTRON_MIRROR: https://cdn.npmmirror.com/binaries/electron/
        run: |
          unset electron_use_remote_checksums npm_config_electron_use_remote_checksums
          node node_modules/electron/install.js

      - name: Unit tests (Vitest, non-Electron)
        run: |
          timeout --signal=TERM --kill-after=30s 20m \
            npm run test -w @multi-publish/desktop -- \
            --maxWorkers=1 --no-file-parallelism --reporter=verbose \
            --testTimeout=10000 --hookTimeout=10000 --teardownTimeout=10000

      - name: Vitest failure diagnostics
        if: failure()
        run: |
          echo "Vitest 或前置步骤失败，输出 runner 进程树"
          ps -eo pid,ppid,stat,etimes,pcpu,pmem,cmd --forest

      - name: Electron smoke test (xvfb)
        run: |
          cd apps/desktop
          set +e
          timeout 30 xvfb-run --auto-servernum npx electron . --no-sandbox --disable-gpu 2>&1
          status=$?
          set -e
          if [ "$status" -eq 124 ]; then
            echo "Electron remained alive for the smoke window"
          elif [ "$status" -eq 0 ]; then
            echo "Electron exited before the smoke window completed"
            exit 1
          else
            exit "$status"
          fi

      - name: Build Vue frontend
        run: |
          npm run build:vue -w @multi-publish/desktop

      - name: Dependency check
        run: npm run check:deps

      - name: Circular dependency check
        run: npm run check:circular
