name: story2video-compose
version: "1.0"
description: >
  Story-to-Video composition pipeline. Takes a long-form text (script or rewritten content),
  splits it into sentences via smart-sentence-splitter, optimizes each sentence into image/video
  prompts via prompt-engine, generates assets (images + TTS) in parallel, composes a slideshow
  video via the Electron ffmpeg compose engine, and optionally publishes to selected platforms.
category: generated
stability: beta
default_checkpoint_policy: guided

# Story2Video-compose 横切依赖：
#   - smart-sentence-splitter (port 8002) - 文本分句（未运行时明确失败）
#   - prompt-engine (port 8013) - 提示词优化（未运行时明确失败）
#   - Electron Story2VideoComposeEngine - Node.js + ffmpeg 视频合成
#   - PublisherRouter - 多平台发布
required_skills:
  - pipelines/story2video/split-director
  - pipelines/story2video/optimize-director
  - pipelines/story2video/asset-director
  - pipelines/story2video/compose-director
  - pipelines/story2video/publish-director

runtime_defaults:
  contentType: general
  imageStyle: cinematic
  aspectRatio: "16:9"
  voiceId: default
  voiceProvider: null
  voiceSpeed: null
  voicePitch: null
  voiceEmotion: null
  voiceVolume: 1
  audio: []
  concurrency: 3
  transition: fade
  imageEffect: none
  subtitleEnabled: true
  subtitleStyle:
    size: md
    style: style1
  bgmVolume: 0.3
  allowPartialAssets: false
  publishEnabled: false

runtime_contract:
  input:
    required_any: [text, images, audio]
    optional: [inputMode, images, audio, contentType, templateId, platforms, title, tags, voiceProvider, voiceSpeed, voicePitch, voiceEmotion, voiceVolume]
    media_limits:
      image: { formats: [jpg, jpeg, png, webp], max_bytes: 10485760 }
      audio: { formats: [wav, m4a, mp3], max_bytes: 52428800, max_total_seconds: 900, max_segment_seconds: 180 }
      bgm: { formats: [wav, m4a, mp3], max_bytes: 15728640 }
      output_max_seconds: 600
    unsupported_modes:
      audio_transcription: "逐段手动 STT 已接入，自动音频识别并分场景的专用模式未实现"
      video_remix: "Story2Video 主链不接受视频素材输入"
    post_generation:
      batch_editor: "已实现分段编辑、排序、删除、旁白替换、图片/视频重试和重新合成"
      local_history: "按用户持久化最近 100 个完成项目，不包含云历史或失败运行断点续作"
      trim: "通过 Python VideoTrimmer + ffmpeg 真实裁剪"
  external_services:
    splitter: "127.0.0.1:8002"
    prompt_engine: "127.0.0.1:8013"
    note: "两项服务未运行时必须返回明确错误，不得伪造成功。"
  output:
    required: [videoPath, audioPath, segments, projectId, fileSize, segmentCount, duration]
    validation: "非空普通文件，并通过 ffmpeg 解码检查"

orchestration:
  mode: stage-executor
  executor_side: electron-js
  notes: >
    与其他流水线不同，story2video-compose 的阶段执行器在 Electron JS 侧
    (StageExecutor + ServiceBus)，Python 后端仅提供 manifest 定义和资源生成技能。

compatible_playbooks:
  recommended:
    - slideshow-narration
    - image-sequence-with-tts
  also_works:
    - cinematic-narration
  custom_allowed: true

stages:
  - name: split
    description: 文案分句 - 调用 smart-sentence-splitter 将长文案切分为句子
    produces:
      - sentences
    tools_available:
      - smart_sentence_splitter
    checkpoint_required: false
    human_approval_default: false
    review_focus:
      - 分句数量合理（5-30 句之间）
      - 每句长度适中（10-100 字）
      - 语义完整，不在连词处断句
    success_criteria:
      - 至少 3 句
      - 每句不超过 200 字
      - 总时长估算 1-10 分钟

  - name: domain_enrich
    description: 可选领域增强 - history 类型识别时代/朝代并生成视觉上下文
    produces:
      - enriched_scenes
    runtime_executor: story2video_domain_enrich
    options:
      contentType: general
    checkpoint_required: false
    human_approval_default: false
    success_criteria:
      - 通用内容原样透传
      - 历史内容每个场景保留原文并附带 imagePromptSeed

  - name: optimize
    description: 批量提示词优化 - 将每句转换为图片生成提示词并优化
    produces:
      - optimized_prompts
    tools_available:
      - prompt_engine
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - 每个提示词与对应句子语义匹配
      - 提示词包含风格、构图、色彩描述
      - 提示词长度适中（20-200 字符）
      - 批量优化无失败
    success_criteria:
      - 优化后的提示词数量等于分句数量
      - 所有提示词通过 schema 验证

  - name: generate_assets
    description: 并行资源生成 - 为每个提示词生成图片 + 为每句生成 TTS 音频（或摄取用户旁白）
    produces:
      - asset_manifest
    required_tools:
      - image_generator
      - tts_engine
    optional_tools:
      - bgm_generator
      - sfx_generator
    tools_available:
      - image_generator
      - tts_engine
      - local_asset_ingest
    runtime_executor: story2video_generate_assets
    options:
      concurrency: 3
      imageStyle: cinematic
      aspectRatio: "16:9"
      voiceId: default
      voiceProvider: null
      voiceSpeed: null
      voicePitch: null
      voiceEmotion: null
      voiceVolume: 1
      audio: []
      allowPartialAssets: false
    output_schema:
      required: [scenes, images, audio, sentences, optimizedPrompts, stats]
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - 所有图片文件存在且可加载
      - TTS 音频时长与对应句子匹配（±20%）
      - 图片风格一致性
      - 总资源大小合理
    success_criteria:
      - 所有图片文件存在
      - 所有 TTS 音频文件存在
      - 资源清单与提示词数量一致

  - name: compose
    description: 视频合成 - Electron 侧 ffmpeg 合成图片、旁白、字幕、转场与可选 BGM
    produces:
      - render_report
    required_tools:
      - ffmpeg
    tools_available:
      - ffmpeg
    runtime_options:
      transition: "none|fade|slide-left|slide-right|slide-up|slide-down"
      imageEffect: "none|zoom-in|zoom-out|pan-left|pan-right|pan-up|pan-down|zoom-pan|rotate|blur-in"
      subtitleEnabled: boolean
      subtitleStyle: object
      bgmPath: local_file
      bgmVolume: "0..1"
      voiceVolume: "0..2，作用于每段旁白与导出的完整旁白"
      watermarkText: string
      watermarkConfig: object
      resolution: "<width>x<height>"
      fps: "1..120"
      defaultSceneDuration: "0.1..60 秒，仅用于无音频或无法探测音频时的场景回退"
      limits: "output<=600s; narration total<=900s; multi-audio segment<=180s"
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - 输出视频可播放
      - 时长与资源总时长匹配（±5%）
      - 字幕同步准确
      - 音视频同步
      - 转场效果自然
    success_criteria:
      - 视频文件为非空普通文件且通过 ffmpeg 解码验证
      - 时长在目标范围内

  - name: publish
    description: 多平台发布 - 将合成视频发布到用户选择的平台
    produces:
      - publish_log
    tools_available:
      - publisher_router
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - 发布到所有选定平台
      - 各平台元数据完整（标题、描述、标签）
      - 发布日志记录成功/失败状态
    success_criteria:
      - 未开启发布或未选择平台时明确标记 skipped
      - 开启发布时至少发布到一个平台，否则流水线失败
      - 发布日志 schema 合法
