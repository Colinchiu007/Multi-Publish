name: story2video-compose
version: "1.1"
description: >
  Story-to-Video composition pipeline. Takes text input only (script or rewritten content),
  splits it into sentences via smart-sentence-splitter, optimizes each sentence into image/video
  prompts via prompt-engine, generates assets (images + TTS) in parallel, composes a slideshow
  video via the Electron ffmpeg compose engine, and optionally publishes to selected platforms.
category: generated
stability: beta
default_checkpoint_policy: guided

# Story2Video-compose 横切依赖：
#   - smart-sentence-splitter (port 8002) - 场景分句（不可用时明确标记并本地降级）
#   - prompt-engine (port 8013) - 提示词优化（未运行时明确失败）
#   - Electron Story2VideoComposeEngine - Node.js + ffmpeg 视频合成
#   - PublisherRouter - 多平台发布
required_skills:
  - pipelines/story2video/split-director
  - pipelines/story2video/optimize-director
  - pipelines/story2video/asset-director
  - pipelines/story2video/compose-director
  - pipelines/story2video/publish-director

runtime_defaults:
  story2videoTextConfig:
    version: 1
    mode: text
    prompt: ""
    size: "720x1280"
    seconds: 8
    contentType: general
    split:
      language: zh
      mode: balanced
      maxSentenceLength: 200
      targetSeconds: 6
      baseWordsPerSecond: 3.3
      speechRate: 1
      minWords: 10
      maxWords: 50
      enforceSentenceBoundary: true
      overflowToNext: true
      subtitleMinChars: 8
      subtitleMaxChars: 15
      subtitleTiming: proportional
    optimize:
      platform: generic
      style: realistic
      creativeLevel: 5
      maxLength: null
      negativePrompt: ""
      numCandidates: 1
      autoDetectStyle: true
      context: ""
    image:
      provider: ""
      model: ""
      style: cinematic
      effect: zoom-in
      aspectRatio: "9:16"
    voice:
      provider: ""
      model: ""
      id: zh_female_qingxinnvsheng_uranus_bigtts
      speed: 1
      volume: 1
      pitch: 0
      emotion: default
    subtitle:
      enabled: false
      font: '"Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif'
      size: size3
      style: style1
      color: white
    bgm:
      enabled: false
      path: ""
      volume: 5
    versions:
      generateBase: true
      generateMerged: true
    perImageDuration: 6
    transition: fade
    templateId: ""
    concurrency: 3
    watermark:
      enabled: false
      text: ""
      position: bottom-right
      fontSize: 24
      opacity: 0.6
      color: white
    output:
      fps: 30
      format: mp4
    publish:
      enabled: false
      platforms: []
      title: ""
      content: ""
      tags: []
      coverUrl: ""

runtime_contract:
  input:
    required: [text]
    optional: [story2videoTextConfig, checkpointPolicy, autoAdvance, initialContext]
    supported_modes: [text]
    config_version: 1
    media_limits:
      bgm: { formats: [wav, m4a, mp3], max_bytes: 15728640 }
      output_max_seconds: 600
    unsupported_modes:
      image: "不接受图片作为流水线输入；图片由 generate_assets 阶段生成"
      remix: "不接受视频素材重混输入"
      gallery: "不接受图库轮播输入"
      audio: "不接受旁白音频作为流水线输入；旁白由 TTS 阶段生成"
      batch: "不接受批任务输入；每次启动创建一个标准 text 运行"
    post_generation:
      batch_editor: "已实现分段编辑、排序、删除、旁白替换、图片/视频重试和重新合成"
      local_history: "按用户持久化最近 100 个完成项目，不包含云历史或失败运行断点续作"
      trim: "通过 Python VideoTrimmer + ffmpeg 真实裁剪"
  external_services:
    splitter: "127.0.0.1:8002"
    prompt_engine: "127.0.0.1:8013"
    note: "splitter 仅在连接/超时等不可用错误时本地降级并标记来源；非法响应仍失败。prompt-engine 未运行时必须返回明确错误。"
  output:
    required: [videoPath, audioPath, segments, projectId, fileSize, segmentCount, duration]
    validation: "非空普通文件，并通过 ffmpeg 解码检查"

orchestration:
  mode: stage-executor
  executor_side: electron-js
  notes: >
    与其他流水线不同，story2video-compose 的阶段执行器在 Electron JS 侧
    (StageExecutor + ServiceBus)，Python 后端仅提供 manifest 定义和资源生成技能。

compatible_playbooks:
  recommended:
    - slideshow-narration
    - image-sequence-with-tts
  also_works:
    - cinematic-narration
  custom_allowed: true

stages:
  - name: split
    description: 双层分句 - smart-sentence-splitter 生成场景，本地逻辑在每个场景内生成字幕块
    produces:
      - scenes
      - sentences
      - segmentation_metadata
    tools_available:
      - smart_sentence_splitter
    options:
      language: zh
      mode: balanced
      max_sentence_length: 200
      target_duration: 6
      base_words_per_second: 3.3
      speech_rate: 1
      min_words: 10
      max_words: 50
      enforce_sentence_boundary: true
      overflow_to_next: true
      subtitle_min_chars: 8
      subtitle_max_chars: 15
      subtitle_timing: proportional
      fallback_to_local: true
      require_scene_output: true
    checkpoint_required: false
    human_approval_default: false
    review_focus:
      - 分句数量合理（5-30 句之间）
      - 每句长度适中（10-100 字）
      - 语义完整，不在连词处断句
    success_criteria:
      - 至少 3 句
      - 每句不超过 200 字
      - 总时长估算 1-10 分钟

  - name: domain_enrich
    description: 可选领域增强 - history 类型识别时代/朝代并生成视觉上下文
    produces:
      - enriched_scenes
    runtime_executor: story2video_domain_enrich
    options:
      contentType: general
    checkpoint_required: false
    human_approval_default: false
    success_criteria:
      - 通用内容原样透传
      - 历史内容每个场景保留原文并附带 imagePromptSeed

  - name: optimize
    description: 批量提示词优化 - 将每句转换为图片生成提示词并优化
    produces:
      - optimized_prompts
    tools_available:
      - prompt_engine
    options:
      platform: generic
      style: realistic
      creative_level: 5
      negative_prompt: ""
      num_candidates: 1
      auto_detect_style: true
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - 每个提示词与对应句子语义匹配
      - 提示词包含风格、构图、色彩描述
      - 提示词长度适中（20-200 字符）
      - 批量优化无失败
    success_criteria:
      - 优化后的提示词数量等于分句数量
      - 所有提示词通过 schema 验证

  - name: generate_assets
    description: 并行资源生成 - 为每个提示词生成图片 + 为每句生成 TTS 音频
    produces:
      - asset_manifest
    required_tools:
      - image_generator
      - tts_engine
    optional_tools:
      - bgm_generator
      - sfx_generator
    tools_available:
      - image_generator
      - tts_engine
    runtime_executor: story2video_generate_assets
    options:
      concurrency: 3
      imageStyle: cinematic
      imageProvider: null
      imageModel: null
      aspectRatio: "9:16"
      voiceId: zh_female_qingxinnvsheng_uranus_bigtts
      voiceProvider: null
      voiceModel: null
      voiceSpeed: 1
      voicePitch: 0
      voiceEmotion: default
      contentType: general
      inputMode: text
      templateId: null
      allowPartialAssets: false
    output_schema:
      required: [scenes, images, audio, sentences, optimizedPrompts, stats]
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - 所有图片文件存在且可加载
      - TTS 音频时长与对应句子匹配（±20%）
      - 图片风格一致性
      - 总资源大小合理
    success_criteria:
      - 所有图片文件存在
      - 所有 TTS 音频文件存在
      - 资源清单与提示词数量一致

  - name: compose
    description: 视频合成 - Electron 侧 ffmpeg 合成图片、旁白、字幕、转场与可选 BGM
    produces:
      - render_report
    required_tools:
      - ffmpeg
    tools_available:
      - ffmpeg
    options:
      transition: fade
      imageEffect: zoom-in
      subtitleEnabled: false
      subtitleStyle:
        font: '"Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif'
        size: md
        style: style1
        color: white
      bgmPath: null
      bgmVolume: 0.5
      voiceVolume: 1
      watermark: false
      watermarkText: ""
      watermarkConfig:
        enabled: false
        text: ""
        position: bottom-right
        fontSize: 24
        opacity: 0.6
        color: white
      resolution: "720x1280"
      fps: 30
      format: mp4
      defaultSceneDuration: 6
      generateBase: true
      generateMerged: true
      seconds: 8
    runtime_options:
      transition: "none|fade|slide-left|slide-right|slide-up|slide-down"
      imageEffect: "none|zoom-in|zoom-out|pan-left|pan-right|pan-up|pan-down|zoom-pan|rotate|blur-in"
      subtitleEnabled: boolean
      subtitleStyle: object
      bgmPath: local_file
      bgmVolume: "0..1，由 Story2VideoTextConfig.bgm.volume(0..10) 归一化"
      voiceVolume: "0..2，作用于每段旁白与导出的完整旁白"
      watermarkText: string
      watermarkConfig: object
      resolution: "<width>x<height>"
      fps: "1..120"
      format: "mp4|webm"
      generateBase: boolean
      generateMerged: boolean
      seconds: "1..60"
      defaultSceneDuration: "1..60 秒，仅用于无音频或无法探测音频时的场景回退"
      limits: "output<=600s; narration total<=900s; multi-audio segment<=180s"
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - 输出视频可播放
      - 时长与资源总时长匹配（±5%）
      - 字幕同步准确
      - 音视频同步
      - 转场效果自然
    success_criteria:
      - 视频文件为非空普通文件且通过 ffmpeg 解码验证
      - 时长在目标范围内

  - name: publish
    description: 多平台发布 - 将合成视频发布到用户选择的平台
    produces:
      - publish_log
    tools_available:
      - publisher_router
    options:
      publishEnabled: false
      platforms: []
      title: ""
      content: ""
      tags: []
      coverUrl: ""
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - 发布到所有选定平台
      - 各平台元数据完整（标题、描述、标签）
      - 发布日志记录成功/失败状态
    success_criteria:
      - 未开启发布或未选择平台时明确标记 skipped
      - 开启发布时至少发布到一个平台，否则流水线失败
      - 发布日志 schema 合法
