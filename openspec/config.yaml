schema: spec-driven

# Project context — injected into ALL artifact instructions (OpenSpec 1.8 OPSX)
context: |
  OpsCenter（运营后台/运营配置中心）: FastAPI（Python 3.12 + SQLAlchemy async + aiosqlite WAL）+ Vue 3（Vite + Element Plus + Pinia）前后端分离仓库。
  职责：平台凭证（secrets，Fernet 加密）、项目参数（config）、模型预设目录（model-presets）、快照/回滚（snapshots）、环境变量只读（env）、feature-gates 同步（sync）。
  铁律：
  - 鉴权复用 orchestrator 的 JWT（共享 OPS_SECRET_KEY/PO_SECRET_KEY，HS256，admin role 才能写）；启动前 validate_security 拒绝空/默认密钥。
  - 后端测试必须 `cd backend && pytest`；前端改动必须 `npm run build` 验证；涉及 UI 的变更需提示视觉回归。
  - 配置 ID 约定 {project}.{category}.{key}；配置传播 API → 文件缓存 → 默认值三层兜底。
  - M+/中高风险任务须创建 OpenSpec change（proposal→design→specs→tasks 后才允许实现）；S/低风险可跳过。
  - 运行时代码（backend/、frontend/）走 codex/ 分支 + PR；纯流程/文档（openspec/、docs/）可 main 直接小步提交。
  - 工作区存在未提交的既有改动（模式 755→644、安全加固等）时，不得以任何理由回滚或覆盖。

# Per-artifact rules — only injected into matching artifacts
rules:
  proposal:
    - 对既有基线先做差异审计，禁止重复规格化已交付功能
  specs:
    - 每个 Requirement 必须至少一个 Scenario，场景用 4 个 # 的 WHEN/THEN 格式
    - 新增能力用 ADDED Requirements，修改既有行为用 MODIFIED（含完整内容）
  design:
    - 记录决策与备选方案（为什么选 X 而非 Y）
    - 标注风险与回退策略
  tasks:
    - 任务按依赖分组，每个任务 ≤ 一个会话，TDD 优先（标注测试目标）

# Per-operation guidance (optional)
operations:
  apply:
    guidance:
      - 保持测试摘要简洁，说明新增/变更测试如何验证 Requirement
  archive:
    guidance:
      - 归档前核对关联 PR 已合并或记录 remoteStatus
